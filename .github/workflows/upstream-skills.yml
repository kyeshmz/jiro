name: Update imported skills
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Check upstreams without a model, or create one tested draft update PR
        type: choice
        options: [check, sync]
        default: sync
permissions:
  contents: read
concurrency:
  group: upstream-skills
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Require a published, reviewed updater revision
        env:
          UPDATER_REF: ${{ vars.OC_PORT_AGENT_REF }}
        run: |
          if [[ ! "$UPDATER_REF" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Set OC_PORT_AGENT_REF to the published commit containing the skill-sync support.' >&2
            exit 1
          fi
      - name: Check out Jiro
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.OC_PORT_GITHUB_TOKEN || github.token }}
      - name: Check out the pinned updater
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: kyeshmz/oc-port-agent
          ref: ${{ vars.OC_PORT_AGENT_REF }}
          path: .tools/oc-port-agent
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build and test the pinned updater
        working-directory: .tools/oc-port-agent
        run: |
          npm ci
          npm test
      - name: Set up Bun for Jiro's compatibility check and tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - name: Install pinned OpenCode V2
        if: github.event_name == 'schedule' || inputs.mode == 'sync'
        run: npm install --global @opencode/cli@2.0.26
      - name: Prepare host Git authentication
        env:
          GH_TOKEN: ${{ secrets.OC_PORT_GITHUB_TOKEN || github.token }}
        run: gh auth setup-git
      - name: Fetch the shared OpenCode credential
        if: github.event_name == 'schedule' || inputs.mode == 'sync'
        env:
          CREDENTIALS_URL: https://opencode-always-on.kye-324.workers.dev/github/credentials
        run: |
          set -euo pipefail
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=opencode-always-on" | jq -r .value)
          echo "::add-mask::$oidc"
          key=$(curl -fsS -X POST -H "Authorization: Bearer $oidc" "$CREDENTIALS_URL" | jq -r '.env.OPENCODE_API_KEY // empty')
          if [[ -z "$key" ]]; then echo 'The credential service returned no OPENCODE_API_KEY.' >&2; exit 1; fi
          echo "::add-mask::$key"
          echo "OPENCODE_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Check or update imported skills
        env:
          MODE: ${{ inputs.mode || 'sync' }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_BASE: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.OC_PORT_GITHUB_TOKEN || github.token }}
          OC_PORT_MODEL: ${{ vars.OC_PORT_MODEL }}
        run: |
          if [[ "$MODE" == 'check' ]]; then
            python3 playbook/upstream-maintenance/scripts/sync.py check --tool .tools/oc-port-agent/dist/src/cli.js
          else
            python3 playbook/upstream-maintenance/scripts/sync.py sync --tool .tools/oc-port-agent/dist/src/cli.js --publish --repository "$TARGET_REPOSITORY" --base "$TARGET_BASE"
          fi
